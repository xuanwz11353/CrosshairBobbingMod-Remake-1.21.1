<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrosshairBobbingMod 下载量</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .sub { color: #8b949e; font-size: .85rem; margin-bottom: 20px; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 24px; min-width: 160px; flex: 1; }
    .stat-card .label { font-size: .85rem; color: #8b949e; }
    .stat-card .value { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
    .modrinth .value { color: #00d4aa; }
    .curseforge .value { color: #f16436; }
    .github .value { color: #58a6ff; }
    .views .value { color: #a371f7; }
    .grid { display: grid; gap: 16px; margin-bottom: 16px; }
    .grid.two { grid-template-columns: 1fr 1fr; }
    @media (max-width: 800px) { .grid.two { grid-template-columns: 1fr; } }
    .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .chart-container h2 { font-size: .95rem; color: #c9d1d9; margin-bottom: 10px; font-weight: 600; }
    .chart-box { position: relative; height: 300px; }
    .chart-box.tall { height: 340px; }
    .update-time { font-size: .8rem; color: #8b949e; margin-top: 12px; text-align: right; }
  </style>
</head>
<body>
  <h1>📊 CrosshairBobbingMod 下载量 / 访问量</h1>
  <div class="sub">数据来源：Modrinth（分析 API） · CurseForge（cfwidget 快照差值） · GitHub Releases（快照差值） · 细分仅含 Modrinth + GitHub，CurseForge 无公开细分</div>

  <div class="stats-row">
    <div class="stat-card modrinth"><div class="label">Modrinth 累计下载</div><div class="value" id="tModrinth">—</div></div>
    <div class="stat-card curseforge"><div class="label">CurseForge 累计下载</div><div class="value" id="tCurseforge">—</div></div>
    <div class="stat-card github"><div class="label">GitHub 累计下载</div><div class="value" id="tGithub">—</div></div>
    <div class="stat-card views"><div class="label">Modrinth 累计访问</div><div class="value" id="tViews">—</div></div>
  </div>

  <div class="grid">
    <div class="chart-container"><h2>每日下载量</h2><div class="chart-box tall"><canvas id="chDownload"></canvas></div></div>
  </div>

  <div class="grid two">
    <div class="chart-container"><h2>每日访问量（Modrinth）</h2><div class="chart-box"><canvas id="chViews"></canvas></div></div>
    <div class="chart-container"><h2>按加载器</h2><div class="chart-box"><canvas id="chLoaders"></canvas></div></div>
  </div>

  <div class="grid">
    <div class="chart-container"><h2>按版本（未知为启动器下载）</h2><div class="chart-box tall"><canvas id="chVersions"></canvas></div></div>
  </div>

  <div class="update-time" id="updateTime"></div>

  <script>
    const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString());
    const grid = 'rgba(48,54,61,.5)';
    const ticks = '#8b949e';
    const baseScales = (extra) => Object.assign({
      x: { ticks: { color: ticks, maxTicksLimit: 15 }, grid: { color: grid } },
      y: { beginAtZero: true, ticks: { color: ticks }, grid: { color: grid } },
    }, extra || {});
    const line = (label, data, color) => ({ label, data, borderColor: color, backgroundColor: color + '22', borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, fill: true });
    const legend = { labels: { color: '#c9d1d9', usePointStyle: true, padding: 16 } };
    const tooltip = { backgroundColor: '#1c2128', borderColor: '#30363d', borderWidth: 1, titleColor: '#f0f6fc', bodyColor: '#c9d1d9' };

    async function loadData() {
      const resp = await fetch('./downloads.json', { cache: 'no-store' });
      const data = await resp.json();
      const daily = data.daily || {};
      const totals = data.totals || {};
      const dates = Object.keys(daily).sort();
      const col = (k) => dates.map((d) => daily[d][k] || 0);

      document.getElementById('tModrinth').textContent = fmt(totals.modrinth);
      document.getElementById('tCurseforge').textContent = fmt(totals.curseforge);
      document.getElementById('tGithub').textContent = fmt(totals.github);
      document.getElementById('tViews').textContent = fmt(totals.views);
      document.getElementById('updateTime').textContent = '数据更新于: ' + (data.updated ? new Date(data.updated).toLocaleString() : '—');

      new Chart(document.getElementById('chDownload'), {
        type: 'line',
        data: { labels: dates, datasets: [line('Modrinth', col('modrinth'), '#00d4aa'), line('CurseForge', col('curseforge'), '#f16436'), line('GitHub', col('github'), '#58a6ff')] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend, tooltip }, scales: baseScales({ y: { beginAtZero: true, ticks: { color: ticks }, grid: { color: grid }, title: { display: true, text: '当日下载量', color: ticks } } }) },
      });

      new Chart(document.getElementById('chViews'), {
        type: 'line',
        data: { labels: dates, datasets: [line('访问量', col('views'), '#a371f7')] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend, tooltip }, scales: baseScales() },
      });

      const bd = data.breakdown || { loaders: {}, versions: [] };
      const lk = ['fabric', 'neoforge', 'unknown'].filter((k) => (bd.loaders[k] || 0) > 0);
      const lkNames = { fabric: 'Fabric', neoforge: 'NeoForge', unknown: '未知' };
      const lkColors = { fabric: '#dbb69b', neoforge: '#f6b26b', unknown: '#6e7681' };
      new Chart(document.getElementById('chLoaders'), {
        type: 'doughnut',
        data: { labels: lk.map((k) => lkNames[k]), datasets: [{ data: lk.map((k) => bd.loaders[k]), backgroundColor: lk.map((k) => lkColors[k]), borderColor: '#161b22', borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9', usePointStyle: true } }, tooltip } },
      });

      const vs = (bd.versions || []).slice(0, 20);
      new Chart(document.getElementById('chVersions'), {
        type: 'bar',
        data: {
          labels: vs.map((v) => v.name + (v.platform === 'github' ? ' (GH)' : '')),
          datasets: [{ label: '下载量', data: vs.map((v) => v.downloads), backgroundColor: vs.map((v) => (v.platform === 'github' ? '#58a6ff' : '#00d4aa')) }],
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip }, scales: { x: { beginAtZero: true, ticks: { color: ticks }, grid: { color: grid } }, y: { ticks: { color: ticks }, grid: { display: false } } } },
      });
    }
    loadData().catch((err) => {
      console.error(err);
      document.getElementById('updateTime').textContent = '数据加载失败：' + err.message;
    });
  </script>
</body>
</html>
