<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrosshairBobbingMod 下载量</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .sub { color: #8b949e; font-size: .85rem; margin-bottom: 20px; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 24px; min-width: 180px; }
    .stat-card .label { font-size: .85rem; color: #8b949e; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .modrinth .value { color: #00d4aa; }
    .curseforge .value { color: #f16436; }
    .github .value { color: #58a6ff; }
    .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; height: 520px; }
    .update-time { font-size: .8rem; color: #8b949e; margin-top: 12px; text-align: right; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>📊 CrosshairBobbingMod 每日下载量</h1>
  <div class="sub">数据来源：Modrinth（每日分析 API） · CurseForge（官方镜像 API 快照差值） · GitHub Releases（快照差值）</div>

  <div class="stats-row">
    <div class="stat-card modrinth"><div class="label">Modrinth 累计</div><div class="value" id="modrinthTotal">—</div></div>
    <div class="stat-card curseforge"><div class="label">CurseForge 累计</div><div class="value" id="curseforgeTotal">—</div></div>
    <div class="stat-card github"><div class="label">GitHub 累计</div><div class="value" id="githubTotal">—</div></div>
  </div>

  <div class="chart-container"><canvas id="downloadChart"></canvas></div>
  <div class="update-time" id="updateTime"></div>

  <script>
    const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString());
    async function loadData() {
      const resp = await fetch('./downloads.json', { cache: 'no-store' });
      const data = await resp.json();
      const daily = data.daily || {};
      const totals = data.totals || {};
      const dates = Object.keys(daily).sort();

      const modrinth = dates.map((d) => daily[d].modrinth || 0);
      const curseforge = dates.map((d) => daily[d].curseforge || 0);
      const github = dates.map((d) => daily[d].github || 0);

      document.getElementById('modrinthTotal').textContent = fmt(totals.modrinth);
      document.getElementById('curseforgeTotal').textContent = fmt(totals.curseforge);
      document.getElementById('githubTotal').textContent = fmt(totals.github);
      document.getElementById('updateTime').textContent = '数据更新于: ' + (data.updated ? new Date(data.updated).toLocaleString() : '—');

      const mk = (label, data, color) => ({
        label, data, borderColor: color, backgroundColor: color + '22',
        borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, fill: true,
      });

      new Chart(document.getElementById('downloadChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: dates,
          datasets: [mk('Modrinth', modrinth, '#00d4aa'), mk('CurseForge', curseforge, '#f16436'), mk('GitHub', github, '#58a6ff')],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#c9d1d9', usePointStyle: true, padding: 20 } },
            tooltip: { backgroundColor: '#1c2128', borderColor: '#30363d', borderWidth: 1, titleColor: '#f0f6fc', bodyColor: '#c9d1d9' },
          },
          scales: {
            x: { ticks: { color: '#8b949e', maxTicksLimit: 15 }, grid: { color: 'rgba(48,54,61,.5)' } },
            y: { beginAtZero: true, ticks: { color: '#8b949e' }, grid: { color: 'rgba(48,54,61,.5)' }, title: { display: true, text: '当日下载量', color: '#8b949e' } },
          },
        },
      });
    }
    loadData().catch((err) => {
      console.error(err);
      document.getElementById('updateTime').textContent = '数据加载失败：' + err.message;
    });
  </script>
</body>
</html>
